<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JD Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="title">
        <svg class="w-6 h-6" style="color: var(--primary); width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        JD Checker
      </h1>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </div>

    <!-- Scan Button -->
    <button id="scanBtn" class="btn btn-primary" style="margin-bottom: 1rem;">
      <svg style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      Scan Current Page
    </button>

    <!-- Status Card (hidden until scan) -->
    <div id="statusCard" class="card" style="display: none;">
      <div class="status-row">
        <span class="label">Current Page Status</span>
        <span id="statusBadge" class="badge badge-gray">Scanning...</span>
      </div>
      <p id="statusMessage" class="message">Analyzing Job Description...</p>
    </div>

    <!-- Results List -->
    <div id="resultsContainer" class="results-list" style="display: none;">
      <!-- Results will be injected here -->
    </div>
    
    <!-- Clear Highlights Button -->
    <button id="clearBtn" class="btn btn-secondary" style="display: none;">Clear Highlights</button>

    <!-- Footer -->
    <footer style="margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 0.75rem;">
      <span id="versionDisplay">v1.0.0</span> | <span id="dateDisplay">Deployed: --</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
